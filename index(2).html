<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Pinwheel</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
body{margin:0;overflow:hidden;font-family:Arial}
#ui{
position:fixed;top:10px;left:10px;z-index:9999;
background:rgba(255,255,255,.92);
padding:12px;border-radius:12px;width:240px
}
input{width:100%}
button{margin-top:6px}
</style>

<script>
let speed=60, running=true;

AFRAME.registerComponent('spin-pinwheel',{
 tick:function(t,dt){
   if(!running) return;
   this.el.object3D.rotation.z -= (speed*dt/1000)*Math.PI/180;
 }
});

window.addEventListener('load',()=>{
 const s=document.getElementById('speed');
 s.oninput=e=>{
   speed=Number(e.target.value);
   document.getElementById('v').innerText=speed;
 };
 document.getElementById('start').onclick=()=>running=true;
 document.getElementById('stop').onclick=()=>running=false;
});
</script>
</head>
<body>

<div id="ui">
<b>Pinwheel Speed</b><br><br>
<input id="speed" type="range" min="0" max="360" value="60">
<div>Speed: <span id="v">60</span> deg/sec</div>
<button id="start">Start</button>
<button id="stop">Stop</button>
</div>

<a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false">
<a-marker preset="hiro">

<a-cylinder position="0 0.55 0" radius="0.02" height="1.2" color="#A97142"></a-cylinder>

<a-entity id="rotor" position="0 1.15 0" spin-pinwheel>

<a-sphere radius="0.09" color="#f6a6ba"></a-sphere>

<a-cone position="0 0.33 0" radius-bottom="0.15" radius-top="0.01" height="0.55" color="#f7b5cf"></a-cone>
<a-cone position="0.33 0 0" rotation="0 0 -90" radius-bottom="0.15" radius-top="0.01" height="0.55" color="#b89cff"></a-cone>
<a-cone position="0 -0.33 0" rotation="0 0 180" radius-bottom="0.15" radius-top="0.01" height="0.55" color="#ffd84a"></a-cone>
<a-cone position="-0.33 0 0" rotation="0 0 90" radius-bottom="0.15" radius-top="0.01" height="0.55" color="#52d6d0"></a-cone>

<a-entity position="0.15 0.15 0.04">
<a-sphere radius="0.01" color="#8d5a1f"></a-sphere>
<a-sphere radius="0.04" position="-0.04 0 0" color="#ffeb3b"></a-sphere>
<a-sphere radius="0.04" position="0.04 0 0" color="#ffeb3b"></a-sphere>
</a-entity>

<a-entity position="-0.15 -0.08 0.04">
<a-sphere radius="0.01" color="#8d5a1f"></a-sphere>
<a-sphere radius="0.04" position="-0.04 0 0" color="#ffeb3b"></a-sphere>
<a-sphere radius="0.04" position="0.04 0 0" color="#ffeb3b"></a-sphere>
</a-entity>

<a-entity position="0.04 -0.22 0.04">
<a-sphere radius="0.01" color="#8d5a1f"></a-sphere>
<a-sphere radius="0.04" position="-0.04 0 0" color="#ffeb3b"></a-sphere>
<a-sphere radius="0.04" position="0.04 0 0" color="#ffeb3b"></a-sphere>
</a-entity>

</a-entity>
</a-marker>

<a-entity camera></a-entity>
</a-scene>
</body>
</html>
